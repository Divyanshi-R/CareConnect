server:
  port: 0

spring:
  application:
    name: CareConnect-Test

  datasource:
    url: jdbc:h2:mem:careconnect_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:careconnect-test-only-signing-key-not-for-production}
    expiration-ms: 86400000
  security:
    allow-privileged-registration: true
  init:
    admin-email:
    admin-password:
